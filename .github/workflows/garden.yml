name: Community garden

on:
  issues:
    types: [opened]
  schedule:
    # 07:00 and 23:00 in Havana (UTC-4 in summer, UTC-5 in winter; close enough).
    - cron: "0 11 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: readme
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  grow:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'garden:')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Plant
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PLANTER: ${{ github.event.issue.user.login }}
          SEED: ${{ github.event.issue.number }}
        run: |
          export PATTERN="${ISSUE_TITLE#garden:}"
          if python3 scripts/garden.py plant 2> error.txt; then
            gh issue close "$ISSUE_NUMBER" --comment "🌱 Planted. [See the garden](https://github.com/DayanCabrera2003#community-garden)."
          else
            gh issue close "$ISSUE_NUMBER" --comment "That did not work: $(cat error.txt)"
          fi
      - name: Grow
        if: github.event_name != 'issues'
        run: python3 scripts/garden.py tick
      - name: Day or night avatar
        run: |
          hour=$(TZ=America/Havana date +%-H)
          if [ "$hour" -ge 23 ] || [ "$hour" -lt 7 ]; then pose=night; else pose=day; fi
          if [ -f "assets/avatar-$pose.svg" ]; then cp "assets/avatar-$pose.svg" assets/avatar.svg; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md garden assets
          git diff --cached --quiet && exit 0
          git commit -m "Garden: generation update"
          git push
