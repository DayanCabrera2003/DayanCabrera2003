name: Avatar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    # One at a time, so two runs never compute from the same state.
    concurrency:
      group: avatar
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pick the avatar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/avatar_state.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/avatar.svg
          git diff --cached --quiet && exit 0
          git commit -m "Avatar: update state"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((attempt * 3))
          done
          exit 1
